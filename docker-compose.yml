services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lipair
      POSTGRES_USER: lipair
      POSTGRES_PASSWORD: lipair
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lipair"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: postgres://lipair:lipair@postgres:5432/lipair?sslmode=disable
      JWT_SECRET: dev-secret-change-in-production
      SERVER_PORT: "8080"
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000,http://localhost:80
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: http://localhost:8080/api/auth/google/callback
      LICHESS_CLIENT_ID: ${LICHESS_CLIENT_ID:-}
      LICHESS_CLIENT_SECRET: ${LICHESS_CLIENT_SECRET:-}
      LICHESS_REDIRECT_URL: http://localhost:8080/api/auth/lichess/callback
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - bin/
            - tmp/
            - .air.toml
        - action: sync+restart
          path: ./backend/.air.toml
          target: /app/.air.toml
        - action: rebuild
          path: ./backend/go.mod
        - action: rebuild
          path: ./backend/go.sum
        - action: rebuild
          path: ./backend/Dockerfile.dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      API_PROXY_TARGET: http://backend:8080
    ports:
      - "3000:5173"
    depends_on:
      - backend
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/index.html
          target: /app/index.html
        - action: sync
          path: ./frontend/tailwind.config.js
          target: /app/tailwind.config.js
        - action: sync
          path: ./frontend/postcss.config.js
          target: /app/postcss.config.js
        - action: sync+restart
          path: ./frontend/vite.config.ts
          target: /app/vite.config.ts
        - action: sync+restart
          path: ./frontend/tsconfig.json
          target: /app/tsconfig.json
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json
        - action: rebuild
          path: ./frontend/Dockerfile.dev

volumes:
  postgres_data:
